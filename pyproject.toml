[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chemtrans"
version = "0.1.0"
description = "Toy models for chemistry -> biochemistry as a nonequilibrium phase transition"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
